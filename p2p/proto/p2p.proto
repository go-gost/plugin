// protoc --go_out=. --go_opt=paths=source_relative \
//	--go-grpc_out=. --go-grpc_opt=paths=source_relative \
//	p2p.proto

syntax = "proto3";
package proto;
option go_package = "github.com/go-gost/plugin/p2p/proto";

// OpenTunnel asks the plugin to establish a tunnel to the given peer and
// return a local endpoint for it.
//
// peer is opaque to the client: its semantics are defined by the plugin
// itself (rendezvous capability ID, WG public key, custom credential...).
// The client only passes it through.
message OpenTunnelRequest {
	string peer = 1;
	// network selects the endpoint's semantics: "tcp" (a byte stream; empty
	// means tcp) or "udp" (a datagram endpoint, one datagram per write).
	// Values are validated by the plugin.
	string network = 2;
}

// id is assigned by the server; the client must return it verbatim when
// closing the tunnel.
message OpenTunnelReply {
	bool ok = 1;
	string id = 2;
	// endpoint is the tunnel handle (not interpreted by GOST): a locally
	// dialable "host:port" of the requested network (no scheme).
	string endpoint = 3;
	string error = 4; // human-readable reason when ok == false
}

message CloseTunnelRequest {
	string id = 1;
}

message CloseTunnelReply {
	bool ok = 1;
}

message StatusRequest {}

message StatusReply {
	int32 tunnels = 1; // future path/status fields are added here
}

service P2P {
	rpc OpenTunnel(OpenTunnelRequest) returns (OpenTunnelReply);
	rpc CloseTunnel(CloseTunnelRequest) returns (CloseTunnelReply);
	rpc Status(StatusRequest) returns (StatusReply);
}